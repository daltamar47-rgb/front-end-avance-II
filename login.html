    <nav class="navbar navbar-expand-lg navbar-custom navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Habitaciones CR</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>

    <header class="encabezado">
        <div class="container">
            <h1>Ingresar</h1>
            <p class="mb-0">Ingrese sus credenciales.</p>
        </div>
    </header>

    <main class="container mt-4" style="max-width: 420px;">
        <form class="card card-body">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="clave" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="clave" name="clave" required>
            </div>
            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>
        <p class="text-center mt-3">¿No tiene cuenta? <a href="contacto.html">Contáctenos</a></p>
    </main>

    <footer class="mt-5 py-4 text-center">
        <p class="mb-1"><a href="#">Políticas de privacidad</a> | <a href="#">Términos y condiciones</a></p>
